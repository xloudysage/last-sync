[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lastsync-desktop"
version = "2.0.0"
description = "Native Last.fm to Spotify Track Follow companion"
requires-python = ">=3.12"
dependencies = ["PyQt6>=6.6,<7", "httpx>=0.28,<0.29", "keyring>=25,<26; sys_platform != 'win32'"]

[project.optional-dependencies]
build = ["pyinstaller>=6.14,<7"]

[project.gui-scripts]
lastsync = "lastsync:main"

[tool.setuptools]
py-modules = ["lastsync"]

[tool.setuptools.packages.find]
include = ["lastsync_core*", "lastsync_ui*"]
